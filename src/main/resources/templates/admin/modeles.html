<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{fragments/base-app :: base-app(~{::content}, 'Modèles d’IA', 'modeles')}">

  <th:block th:fragment="content">
    <div class="page">

      <div class="wrapw">

        <div class="bar">
          <h1>Modèles d’IA</h1>

          <div class="srch">
            <input id="searchModel"
                   type="search"
                   placeholder="Rechercher un modèle…"
                   aria-label="Rechercher un modèle">
          </div>

          <a class="btn pri" th:href="@{/admin/modeles/nouveau}">
            ＋ Nouveau modèle
          </a>
        </div>

        <div class="card wrap">

          <table>
            <thead>
            <tr>
              <th>Modèle</th>
              <th>Fournisseur</th>
              <th>Description</th>
              <th>Actions</th>
            </tr>
            </thead>

            <tbody id="modelsTable">

            <tr th:each="modele : ${modeles}">
              <td>
                <div class="who">

                  <div class="mlogo"
                       th:text="${#strings.substring(modele.nom,0,1)}">
                    M
                  </div>

                  <div>
                    <b th:text="${modele.nom}">Nom du modèle</b>
                    <small th:text="${modele.urlAPI}">URL API</small>
                  </div>

                </div>
              </td>

              <td th:text="${modele.fourniseurIA != null ? modele.fourniseurIA.nom : '—'}">
                Fournisseur
              </td>

              <td th:text="${modele.description}">
                Description
              </td>

              <td>
                <div class="acts">

                  <a class="btn ico"
                     title="Voir"
                     aria-label="Voir"
                     th:href="@{/admin/modeles/{id}(id=${modele.id})}">
                    ◉
                  </a>

                  <a class="btn ico"
                     title="Modifier"
                     aria-label="Modifier"
                     th:href="@{/admin/modeles/{id}/modifier(id=${modele.id})}">
                    ✎
                  </a>

                  <form th:action="@{/admin/modeles/{id}/supprimer(id=${modele.id})}"
                        method="post">

                    <button class="btn ico bad"
                            type="submit"
                            title="Supprimer"
                            aria-label="Supprimer">
                      ⌫
                    </button>

                  </form>

                </div>
              </td>
            </tr>

            <tr th:if="${modeles == null or #lists.isEmpty(modeles)}">
              <td colspan="4" style="color:var(--mut)">
                Aucun modèle disponible pour le moment.
              </td>
            </tr>

            </tbody>
          </table>

        </div>
      </div>
    </div>

    <script>
      document.getElementById('searchModel')?.addEventListener('input', function () {
        const value = this.value.toLowerCase();

        document.querySelectorAll('#modelsTable tr').forEach(row => {
          row.hidden = !row.innerText.toLowerCase().includes(value);
        });
      });
    </script>

  </th:block>
</th:block>
</html>
