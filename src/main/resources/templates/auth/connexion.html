<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: base(~{::content}, 'ChatBot - Connexion')}">

<body>

<section th:fragment="content" class="container py-5">

  <div class="row justify-content-center">

    <div class="col-md-6">

      <h1 class="mb-4">Connexion</h1>

      <form>

        <div class="mb-3">
          <label for="email" class="form-label">
            Adresse e-mail
          </label>

          <input
                  type="email"
                  class="form-control"
                  id="email"
                  placeholder="Entrez votre adresse e-mail">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">
            Mot de passe
          </label>

          <input
                  type="password"
                  class="form-control"
                  id="password"
                  placeholder="Entrez votre mot de passe">
        </div>

        <button type="button" class="btn btn-primary">
          Se connecter
        </button>

      </form>

    </div>

  </div>

</section>

</body>
</html>
