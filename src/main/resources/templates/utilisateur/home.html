<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: base(~{::content}, 'ChatBot - Conversation')}">

<body>

<!-- Attendus du contrôleur (tous optionnels) :
     modeles (liste avec id, nom), modeleCourant, messages (auteur 'USER' ou 'IA', texte) -->
<section th:fragment="content" class="chat-view">

    <div class="chat-tools" th:unless="${#lists.isEmpty(modeles)}">
        <label for="modele" class="visually-hidden">Modèle d’IA</label>
        <select id="modele" name="modele" class="form-select">
            <option th:each="m : ${modeles}" th:value="${m.id}" th:text="${m.nom}">Modèle</option>
        </select>
    </div>

    <div class="msgs" id="msgs">
        <div class="col-chat">

            <div class="hero" th:if="${#lists.isEmpty(messages)}">
                <div class="orbs"><svg width="50" height="50"><use href="#logo"/></svg></div>
                <h3>Comment puis-je vous aider ?</h3>
                <p>Posez votre question ou choisissez une suggestion.</p>
                <div class="sg">
                    <button type="button" data-suggest="Résume ce texte">
                        <b>Résumer un texte</b><span>Collez un document, j’en tire l’essentiel.</span>
                    </button>
                    <button type="button" data-suggest="Explique-moi une notion">
                        <b>Expliquer une notion</b><span>Une API, un algorithme, un concept.</span>
                    </button>
                    <button type="button" data-suggest="Aide-moi à rédiger un e-mail">
                        <b>Rédiger un e-mail</b><span>Un message clair et professionnel.</span>
                    </button>
                </div>
            </div>

            <div th:each="m : ${messages}" class="row-msg" th:classappend="${m.auteur == 'USER'} ? 'u'">
                <div class="bub">
                    <small th:if="${m.auteur != 'USER'}">Assistant</small>
                    <span th:text="${m.texte}">Message</span>
                </div>
            </div>

        </div>
    </div>

    <div class="composer">
        <form id="chatForm" th:action="@{/chat}" method="post" class="cbox">
            <textarea name="message" rows="1" aria-label="Message"
                      placeholder="Écrivez votre message…"></textarea>
            <button class="btn btn-primary" type="submit" aria-label="Envoyer">
                <svg class="i"><use href="#i-send"/></svg>
            </button>
        </form>
    </div>

    <script>
        (function () {
            var msgs = document.getElementById('msgs');
            var form = document.getElementById('chatForm');
            if (msgs) { msgs.scrollTop = msgs.scrollHeight; }
            if (!form) { return; }
            var ta = form.querySelector('textarea');

            ta.addEventListener('input', function () {
                ta.style.height = 'auto';
                ta.style.height = Math.min(ta.scrollHeight, 140) + 'px';
            });

            ta.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    if (!e.shiftKey) {
                        e.preventDefault();
                        if (ta.value.trim() !== '') { form.requestSubmit(); }
                    }
                }
            });

            document.querySelectorAll('[data-suggest]').forEach(function (b) {
                b.addEventListener('click', function () {
                    ta.value = b.dataset.suggest;
                    form.requestSubmit();
                });
            });
        })();
    </script>

</section>

</body>
</html>
